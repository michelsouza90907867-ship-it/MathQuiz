name: Build Math Quiz APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências de sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ccache git libffi-dev libssl-dev openjdk-17-jdk

      - name: Instalar Buildozer e Cython
        run: |
          pip install --upgrade pip setuptools
          pip install buildozer cython

      - name: Aceitar licenças e Gerar APK
        run: |
          # Prepara o SDK interno do buildozer antes da compilação
          buildozer android debug || true
          
          # Aceita todas as licenças dentro da pasta do SDK do Buildozer
          if [ -d "$HOME/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin" ]; then
            yes | $HOME/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true
          fi

          # Executa a compilação final
          buildozer -v android debug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: MathQuizAPK
          path: bin/*.apk
          
