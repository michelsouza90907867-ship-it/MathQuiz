name: Build Math Quiz APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências de sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ccache git libffi-dev libssl-dev openjdk-17-jdk

      - name: Instalar Buildozer e Cython
        run: |
          pip install --upgrade pip setuptools
          pip install buildozer cython

      - name: Gerar APK e aceitar licenças
        run: |
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg
          yes | buildozer -v android debug
          
